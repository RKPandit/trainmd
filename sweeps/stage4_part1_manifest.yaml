provenance_note: 'The trial records carry FOUR values of environment.harness_git_commit;
  one code version ran the agents phase. That field records the checkout''s HEAD at
  each trial, and branches were switched in the shared working directory while the
  sweep ran (never again: DECISIONS 2026-09-26). Counts over the 3,229 records: e65e696
  x64 (the pre-run slice, 22:50-23:05 UTC 2026-09-25), b290726 x392 (23:31-01:12),
  e6951b1 x18 (01:12-01:17 2026-09-26), b43e9b8 x2,755 (01:17-20:12). Two processes
  ran: the slice (64 trials, started at e65e696) and the full run (3,152 trials, started
  23:31:25 UTC at b290726 - this manifest''s timestamp and hardware.git_commit, which
  run_agents rewrites on every start, so no later restart occurred). Audited from
  the records (DECISIONS 2026-09-26, ''never switch branches or edit files in the
  checkout a sweep is running from''): the only code that changed in the window is
  verify-phase code (harness/evaluator/verify_repair.py, the new harness/verify_memo.py,
  a guard in sweep.run_verify), which the agents phase never calls; e6951b1 and b43e9b8
  have identical trees; cells seen under more than one commit have identical prompt
  hashes and no cell has two; re-scoring every scored record with one code version
  reproduced every stored diagnosis score exactly; the plan file and the price table
  (sha256:aa762d516ea7c08f on every trial) were unchanged; no case file changed after
  the first trial. git_dirty is true on every record only because of untracked files.
  3,229 records for 3,216 cells: 13 cells hold a crashed first attempt plus a completed
  retry, and analysis keeps one record per cell. Sweeps after this one record the
  running process instead (environment.process; DECISIONS 2026-09-26, record schema
  1.2).'
