[project]
name = "trainmd"
version = "0.1.0"
description = "TrainMD: Evidence-Grounded Diagnosis and Verified Recovery of Controlled ML Training Incidents"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
# Upper bounds cap the breaking MAJORS the code is not written for: the
# AnthropicClient uses the 0.x Messages API (temperature is a top-level
# messages.create kwarg — anthropic 1.x removed it), and OpenAIClient uses the
# openai 2.x Responses API. Without the caps, uv resolved anthropic 1.4.0 /
# openai 3.16.2 for python>=3.10 (both py3.11 CI + the canonical container),
# which raised "Messages.create() got an unexpected keyword argument
# 'temperature'" client-side. NOT a loosened pin — a tightened one. See
# docs/DECISIONS.md 2026-09-20.
llm = ["anthropic>=0.40.0,<1", "openai>=1.40.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow_integration: marks tests that run training (deselect with '-m \"not slow_integration\"')",
]

[tool.uv]
# Use CPU-only PyTorch on Linux to avoid pulling the ~2 GB CUDA wheel in CI.
# macOS ARM wheels are only on PyPI, so this index is Linux-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]
