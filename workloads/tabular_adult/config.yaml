workload:
  family: tabular
  name: tabular_adult

model:
  type: mlp
  hidden_dims: [64, 32]
  dropout: 0.0
  activation: relu

training:
  epochs: 20
  batch_size: 256
  lr: 0.01
  optimizer: adam
  weight_decay: 0.0001

metrics:
  visible: metric_visible_val_acc      # agent sees this during investigation

reference:
  # 30-seed reference band, adopted STAGE3_PLAN §0.5 (two-runner byte-exact on native amd64, mean-2σ
  # band; see docs/DECISIONS.md and reference/stats.yaml). NOTE: this file is copied VERBATIM into some
  # case workspaces, so it must NOT quote any hidden value (the tolerance / hidden mean / hidden std) —
  # doing so leaks it past the W4 wall (regression caught 2026-09-15) — nor any operator-id segment
  # (W1). The prior 10-seed band is preserved at reference/stats.10seed.yaml. The reference-30seed
  # candidate workflow can regenerate a candidate at any N via --num-seeds N; default = seeds[:30].
  # §5.2: reference seeds moved 0–29 → 200–229 to break the seed collision with
  # control/calibration seeds (LIMITATIONS L3; the four disjoint sets live in
  # harness/seed_sets.py). The old 0–29 are now DEVELOPMENT seeds.
  num_seeds: 30
  seeds: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209,
          210, 211, 212, 213, 214, 215, 216, 217, 218, 219,
          220, 221, 222, 223, 224, 225, 226, 227, 228, 229]
