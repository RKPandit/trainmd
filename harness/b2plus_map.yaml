# B2+ knob -> concept map, version 2 — THE ANSWER KEY (STAGE4_PLAN 4.0.6; DECISIONS 2026-09-23).
#
# B2+ is an UPPER BOUND, not a baseline: "config-diff with PERFECT KNOB SEMANTICS". Every knob
# below exists only because one of OUR operators injects a fault through it (the set is exactly the
# union of the faulty operators' admissible-repair `allowed_keys` — test-enforced), so for our own
# operators this map is an answer-key lookup and B2+'s identification is perfect BY CONSTRUCTION.
# It is never a baseline an LLM is compared against to claim value; it bounds what config-diffing
# achieves when the meaning of every injected knob is known in advance.
#
# Any other knob — a legitimate setting (the benign-control knobs) or a future operator's knob — is
# deliberately NOT here: B2+ then FALLS BACK to B2's leaf name, and the fallback rate on such knobs
# is what is reported (scripts/b2plus_report.py).
#
# Each value is the injecting operator's own canonical class (one of its `accepted_classes` —
# test-enforced), so the lookup is exactly the answer key. v1 (commit de29b78) mapped all 13 keys the
# workload code reads to engineering names; replaced by this answer-key-only v2 after review (v1 left
# no held-out knobs to measure fallback on, and a v2 draft that kept an engineering name —
# `evaluation_subset` — scored 0/18 on metric_inflation, i.e. was not the answer key). Any edit bumps
# `version`.
version: 2
knobs:
  training.lr: lr_warmup                              # silent.lr_warmup.v1
  data.label_noise_fraction: label_corruption          # silent.label_corruption.v1
  data.include_aux_feature: data_leakage              # silent.data_leakage.v1
  data.aux_feature_strength: data_leakage             # silent.data_leakage.v1
  data.opt_c: data_leakage                            # silent.data_leakage_neutral.v1
  data.opt_c_level: data_leakage                      # silent.data_leakage_neutral.v1
  metrics.eval_subset_fraction: metric_inflation      # silent.metric_inflation.v1
  model.input_dim: shape_mismatch                      # crash.shape_mismatch.v1
