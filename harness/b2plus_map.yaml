# B2+ DECLARED knob -> concept map (STAGE4_PLAN 4.0.6). One line per KNOWN KNOB: every config key the
# workloads' train.py / datautil.py actually READ (tabular_adult and tabular_adult_neutral; keys never
# collide across the two). Keys the code does not read (model.type, model.activation,
# training.optimizer, metrics.visible) are not knobs and are not listed; the workload / reference
# sections are ignored by B2 itself.
#
# The concept is the plain engineering name for "something is wrong with this knob", written from
# what the CODE does with the key — e.g. data.opt_c / data.opt_c_level feed the same label-derived
# column as data.include_aux_feature (datautil._derived_column), so a reader of train.py names it
# leakage even though the key name says nothing. That is the knowledge B2+ adds over B2 (which only
# echoes the key's leaf name): a one-time read of the code, like a runbook.
#
# DECLARED, NOT TUNED: written 2026-09-23 BEFORE any B2+ result was computed; its sha256 is recorded
# in docs/DECISIONS.md. The author knows the scorer's vocabulary (harness author) — disclosed — but
# no label here was chosen or changed by looking at a B2+ score. Validation on held-out
# (development-seed) instances is reported as-is (docs/audits/b2plus_validation.md); a failure there
# is a finding, not a reason to edit this file. Any later edit bumps `version` and gets a DECISIONS row.
version: 1
knobs:
  model.hidden_dims: model_capacity
  model.dropout: dropout_regularization
  model.input_dim: input_shape_mismatch
  training.epochs: training_length
  training.batch_size: batch_size
  training.lr: learning_rate
  training.weight_decay: weight_decay
  data.label_noise_fraction: label_noise
  data.include_aux_feature: data_leakage
  data.aux_feature_strength: data_leakage
  data.opt_c: data_leakage
  data.opt_c_level: data_leakage
  metrics.eval_subset_fraction: evaluation_subset
