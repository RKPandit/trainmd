name: CI (canonical container)

# Native amd64 (ubuntu-latest), inside the pinned container. Every job does a
# FRESH checkout with NO cached cases/, NO cached .data/, and NO warm uv cache
# (nothing uses actions/cache; deps live in the image, data/cases are generated).
# This is the stranger's-fresh-clone guarantee.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

jobs:
  # ---- Reproducibility gate: TWO INDEPENDENT RUNNERS (amendment 3) ----------
  reference-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        run: [1, 2] # two fresh runners, not two invocations in one shell
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t trainmd:canonical .
      - run: make docker-data
      - name: CI fingerprint (CPU + data hashes)
        run: bash scripts/ci_fingerprint.sh
      - run: make docker-reference
      - uses: actions/upload-artifact@v4
        with:
          name: reference-run-${{ matrix.run }}
          path: workloads/tabular_adult/reference/stats.yaml

  reference-repro-compare:
    needs: reference-repro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: CI fingerprint (CPU; no data prepared here)
        run: bash scripts/ci_fingerprint.sh
      - uses: actions/download-artifact@v4
        with: { name: reference-run-1, path: r1 }
      - uses: actions/download-artifact@v4
        with: { name: reference-run-2, path: r2 }
      - name: Assert the two independent runs are byte-identical
        run: |
          docker build --platform linux/amd64 -t trainmd:canonical .
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work trainmd:canonical \
            python scripts/verify_reference.py r1/stats.yaml r2/stats.yaml
          echo "REPRODUCIBLE: reference-run-1 == reference-run-2 across independent runners"

  # ---- Fresh-clone build + validate + gate + margins (amendments 1, item 4) --
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Disk before
        run: df -h / | tail -1
      - run: docker build --platform linux/amd64 -t trainmd:canonical .
      - name: Build all cases + validate + gate + margins (timed)
        run: |
          START=$(date +%s)
          make docker-data
          make link-neutral-workload               # neutral family shares tabular_adult data
          bash scripts/ci_fingerprint.sh           # CPU + data hashes (diagnostic)
          make docker-reference                    # canonical candidate (ephemeral)
          make docker-build-all-cases              # all cases from the registry design (currently 33), fresh
          make docker-validate-all
          make docker-gate-known-answer
          make docker-case-margins
          END=$(date +%s)
          echo "BUILD_ALL_CASES_WALL_SECONDS=$((END-START))"
      - name: Known-answer gate (FULL — verify_repair recovery)
        run: make docker-gate-known-answer FULL=1
      - name: Positive-symptom rung margin table (all six rungs, both halves)
        run: make docker-margin-report
      - name: Native calibration sweep — data_leakage mild p (largest-p-that-clears)
        run: make docker-calibrate-data-leakage
      - name: Disk after (cases + data footprint)
        run: |
          df -h / | tail -1
          du -sh cases workloads/tabular_adult/.data workloads/tabular_adult/.hidden_data 2>/dev/null || true

  # ---- Full test suite (fresh) ---------------------------------------------
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t trainmd:canonical .
      - name: CURRENT_STATE consistency guard (fast — fails before the suite on doc drift)
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD":/work -w /work \
            trainmd:canonical python scripts/check_current_state.py
      - run: make docker-data
      - run: make link-neutral-workload
      - name: CI fingerprint (CPU + data hashes)
        run: bash scripts/ci_fingerprint.sh
      - name: Regenerate reference and assert it matches the committed canonical (BLOCKING)
        run: |
          # Snapshot the committed reference OUTSIDE the repo, then mount it into
          # the container (the container only sees /work, not the runner's /tmp).
          cp workloads/tabular_adult/reference/stats.yaml /tmp/stats_committed.yaml
          make docker-reference
          # The committed reference is canonical: byte-exact WITHIN a microarch;
          # across heterogeneous native amd64 microarchs the means reproduce within
          # ~1e-3 (<=0.5σ) and σ-estimates within ~3e-3, with data pinned to
          # committed hashes. verify_reference bounds the means (2e-3) and
          # tolerance_lower (6e-3) + an exact derivation check, so a real regression
          # fails while cross-microarch float noise does not (DECISIONS 2026-09-14).
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -v /tmp/stats_committed.yaml:/committed.yaml:ro -w /work \
            trainmd:canonical \
            python scripts/verify_reference.py /committed.yaml \
            workloads/tabular_adult/reference/stats.yaml
          git checkout -- workloads/tabular_adult/reference/stats.yaml
      - name: Full test suite incl. slow (in container)
        run: make docker-test

  # ---- Standing guard: a committed-reference change must rebuild all cases ---
  # The danger is NOT a noisy comparison; it is a SILENTLY-committed reference
  # shift (e.g. tolerance_lower moved 2.99e-3 on a divergent runner — larger than
  # the tightest case-guard margin 1.37e-3) that leaves cases built against the
  # old threshold. When reference/stats.yaml or the data pin changes, this job
  # rebuilds ALL cases against the COMMITTED reference (no regeneration) and
  # requires validate-all + gate green — proving the new committed reference
  # still produces valid cases. See docs/DECISIONS.md (2026-09-14).
  reference-change-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect committed-reference / data-pin change
        id: refchg
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE="HEAD~1"; fi
          if git diff --name-only "$BASE" HEAD | grep -qE "workloads/tabular_adult/reference/(stats|data_manifest)\.yaml"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed reference / data pin CHANGED — full rebuild-against-committed required."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reference/stats.yaml and data_manifest.yaml unchanged — guard not triggered."
          fi
      - name: Rebuild ALL cases against the COMMITTED reference (no regen)
        if: steps.refchg.outputs.changed == 'true'
        run: |
          docker build --platform linux/amd64 -t trainmd:canonical .
          make docker-data                       # data pin verified here
          make link-neutral-workload             # neutral family shares tabular_adult data
          bash scripts/ci_fingerprint.sh
          make docker-build-all-cases            # builds against the COMMITTED reference
          make docker-validate-all
          make docker-gate-known-answer
          make docker-case-margins
      - name: Known-answer gate (FULL — verify_repair recovery)
        if: steps.refchg.outputs.changed == 'true'
        run: make docker-gate-known-answer FULL=1

  # ---- Reproducible-analysis guards (STAGE3_PLAN §0.3): pure-Python, no container ----
  # The committed records RELEASE lets these run with no results/ or cases/ (both gitignored):
  # rebuild each sweep's report FROM THE RELEASE and byte-match the committed generated report;
  # validate every manifest/plan schema; and check that no analysis narrative invents a number.
  repro-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Manifest/plan schema
        run: python scripts/check_manifest_schema.py
      - name: Analysis numbers have a machine source (no invented numbers)
        run: python scripts/check_analysis_numbers.py
      - name: Report scorer version matches the records (provenance)
        run: python scripts/check_scorer_versions.py
      - name: Rebuild each report FROM THE RELEASE and byte-match the committed report
        run: |
          python scripts/rebuild_tables.py --sweep sweep1
          python scripts/rebuild_tables.py --sweep stage2gate
